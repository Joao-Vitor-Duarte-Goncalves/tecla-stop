<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Barlow:wght@600;700&family=Permanent+Marker&display=block">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(120% 90% at 20% 0%,#1b2a52 0,#0b1226 65%);color:#eef2fa;font-family:Barlow,sans-serif;position:relative}
.txt{position:absolute;left:72px;top:92px;width:620px}
h1{font-family:"Bowlby One";font-weight:400;font-size:104px;line-height:.92;margin:0}
.slip{display:inline-block;margin-top:34px;background:#fbf6ea;color:#2a2018;border-radius:4px 4px 10px 10px;padding:18px 26px;transform:rotate(-2deg);box-shadow:0 14px 30px rgba(0,0,0,.45);font-family:"Permanent Marker";font-size:34px;position:relative}
.slip:before{content:"";position:absolute;left:0;right:0;top:-9px;height:10px;background:linear-gradient(135deg,#fbf6ea 50%,transparent 50%) 0 0/12px 10px repeat-x,linear-gradient(-135deg,#fbf6ea 50%,transparent 50%) 0 0/12px 10px repeat-x}
p{font-size:30px;font-weight:600;color:#a3b0c9;margin:34px 0 0;line-height:1.35;max-width:560px}
.mesa{position:absolute;left:760px;top:70px;width:620px;height:620px;border-radius:50%;container-type:inline-size;
 background:repeating-conic-gradient(#ffd84a 0 4deg,#a77f00 4deg 8deg);box-shadow:-20px 30px 60px rgba(0,0,0,.5)}
.mesa:before{content:"";position:absolute;inset:4.5%;border-radius:50%;background:radial-gradient(circle at 38% 30%,#ffd84a 0,#f6c21c 42%,#c99a05 100%);box-shadow:inset 0 0 0 8px rgba(255,255,255,.18)}
.cap{position:absolute;left:50%;top:50%;width:13%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:"Bowlby One";font-size:6cqw;color:#c0261c;
 transform:translate(-50%,-50%) rotate(var(--a)) translateY(-40.5cqw) rotate(calc(-1*var(--a)));
 background:radial-gradient(circle at 46% 40%,#fff 0 18%,transparent 46%),radial-gradient(circle,#f3efe6 0 55%,#cfc7b6 56% 61%,transparent 62%),repeating-conic-gradient(#b9b2a3 0 8deg,#8f887a 8deg 15deg);box-shadow:0 4px 0 rgba(0,0,0,.4),0 8px 14px rgba(0,0,0,.3)}
.hub{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 50% 35%,#2b211a,#120d0a);display:grid;place-items:center;box-shadow:0 0 0 8px rgba(0,0,0,.25)}
.hub b{font-family:"Bowlby One";font-weight:400;font-size:96px;color:#f6c21c}
</style></head><body>
<div class="txt"><h1>Tecla Stop<br>do Bar</h1><div class="slip">Coisas que se fala no bar</div>
<p>Sai um tema. Fale uma palavra e toque a tampinha antes do tempo acabar.</p></div>
<div class="mesa"><span class="cap" style="--a:-90deg">P</span><span class="cap" style="--a:-72deg">R</span><span class="cap" style="--a:-54deg">S</span><span class="cap" style="--a:-36deg">T</span><span class="cap" style="--a:-18deg">U</span><span class="cap" style="--a:0deg">V</span><span class="cap" style="--a:18deg">A</span><span class="cap" style="--a:36deg">B</span><span class="cap" style="--a:54deg">C</span><span class="cap" style="--a:72deg">D</span><span class="cap" style="--a:90deg">E</span><div class="hub"><b>10</b></div></div>
</body></html>
